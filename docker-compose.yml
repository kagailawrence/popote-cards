networks:
  edge:
    external: true
  popote-network:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: popote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-popote_cards}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db:/server-db:ro
      - ./docker/postgres/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    networks:
      - popote-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: popote-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - popote-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: popote-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-4000}:4000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.popote-api.rule=Host(`popote.dazzcode.com`) && (PathPrefix(`/api`) || PathPrefix(`/storage`))"
      - "traefik.http.routers.popote-api.entrypoints=websecure"
      - "traefik.http.routers.popote-api.tls.certresolver=myresolver"
      - "traefik.http.services.popote-api.loadbalancer.server.port=4000"
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-production}
      FRONTEND_URL: ${FRONTEND_URL:-https://popote.dazzcode.com}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-popote_cards}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-037f66b9c95517116f4e0e6aab2c043ebf3a626c52e2d282b6bc4d40a424658b}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-df2658125511e9ad477264264a9fd370ddca2ec9e3bfe60ac82f423d30a07885}
      MPESA_ENV: ${MPESA_ENV:-sandbox}
    volumes:
      - ./storage:/app/storage
    networks:
      - edge
      - popote-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        INTERNAL_BACKEND_URL: http://server:4000
    container_name: popote-frontend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.popote-frontend.rule=Host(`popote.dazzcode.com`)"
      - "traefik.http.routers.popote-frontend.entrypoints=websecure"
      - "traefik.http.routers.popote-frontend.tls.certresolver=myresolver"
      - "traefik.http.services.popote-frontend.loadbalancer.server.port=3000"
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      INTERNAL_BACKEND_URL: http://server:4000
      NEXT_PUBLIC_API_URL: /api/v1
    networks:
      - edge
      - popote-network
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  postgres_data:
  redis_data: